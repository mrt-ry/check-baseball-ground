name: selenium-github-actions
on: 
  workflow_dispatch:
  schedule:
    - cron: '23 22 * * *'  # 毎日7:23（JST）狙い。毎時0分は遅延しやすいためずらしている
    - cron: '23 10 * * *'  # 毎日19:23（JST）狙い
jobs:
  selenium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write  # Gitプッシュのために必要
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
      GAME_RECRUITMENT_URL: ${{ secrets.GAME_RECRUITMENT_URL }}
      MANAGEMENT_SCREEN_LOGIN_ID: ${{ secrets.MANAGEMENT_SCREEN_LOGIN_ID }}
      MANAGEMENT_SCREEN_PASSWORD: ${{ secrets.MANAGEMENT_SCREEN_PASSWORD }}
      GIT_REPO: ${{ secrets.GIT_REPO }}
      GITHUB_BRANCH: ${{ secrets.GIT_BRANCH }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
      - name: Install dependencies
        run: |
          pip install selenium beautifulsoup4 requests python-dotenv pillow
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run script
        run: |
          python -u check_baseball_ground.py 