name: selenium-github-actions
on: 
  workflow_dispatch:
    inputs:
      skip_parks:
        description: '都立公園の取得をスキップする（動作確認用）'
        type: boolean
        default: false
      dry_run:
        description: 'LINE通知を送らない（一時的に既定でオン。通知を再開するときは default を false に戻す）'
        type: boolean
        default: true  # TEMP: 動作確認中のため、入力なしの実行（cron-job.org）でもLINEを送らない
  # 定期実行は GitHub の schedule ではなく cron-job.org から workflow_dispatch で起動する
  # （schedule は数時間遅延するため）。毎日 06:40 / 18:40 (JST)
jobs:
  selenium:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write  # Gitプッシュのために必要
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
      GAME_RECRUITMENT_URL: ${{ secrets.GAME_RECRUITMENT_URL }}
      MANAGEMENT_SCREEN_LOGIN_ID: ${{ secrets.MANAGEMENT_SCREEN_LOGIN_ID }}
      MANAGEMENT_SCREEN_PASSWORD: ${{ secrets.MANAGEMENT_SCREEN_PASSWORD }}
      GIT_REPO: ${{ secrets.GIT_REPO }}
      GITHUB_BRANCH: ${{ secrets.GIT_BRANCH }}
      SKIP_PARKS: ${{ inputs.skip_parks }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install Japanese fonts
        # フォントはスクリーンショットの文字表示用。aptが遅い/失敗しても通知は止めない
        timeout-minutes: 5
        continue-on-error: true
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y fonts-noto-cjk fonts-noto-cjk-extra
      - name: Install dependencies
        run: |
          pip install selenium beautifulsoup4 requests python-dotenv pillow
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run script
        run: |
          python -u check_baseball_ground.py 